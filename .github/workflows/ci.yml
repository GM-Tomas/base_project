name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers-based integration tests and contractDriftCheck's forked app both need
      # Docker, which ubuntu-latest ships with pre-started — nothing extra to set up here (this
      # is exactly what a local dev machine without Docker can't run, see tasks.md's Fase 0-7 notes).
      - name: spotlessCheck
        run: ./gradlew spotlessCheck

      - name: detekt
        run: ./gradlew detekt

      # Unit tests + Testcontainers integration tests + per-response contract validation against
      # contracts/openapi.yaml (ContractValidation.kt, T-82) — all plain JUnit tests on the same
      # `test` task, not separate Gradle tasks.
      - name: test (unit + integration + contract)
        run: ./gradlew test

      - name: jacocoTestCoverageVerification
        run: ./gradlew jacocoTestCoverageVerification

      # Boots the app once to scrape /v3/api-docs (generateOpenApiDocs) and diffs the result
      # against contracts/openapi.yaml at the path+method level (tasks.md T-83, plan.md §8.4).
      - name: contractDriftCheck
        run: ./gradlew contractDriftCheck

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
