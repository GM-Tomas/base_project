server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: base-wealth-backend
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    default-property-inclusion: non_null

# Springdoc OpenAPI Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Application-specific properties
wealth:
  default-fx-usd-ars: 1050.0
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "https://*.vercel.app"

logging:
  level:
    root: INFO
    com.base.wealth: DEBUG
    org.springframework.web: INFO

---
# Prod: KVS-in-Supabase, wired via DataSourceConfig (see BaseWealthApplication for why
# auto-config is off). Point SUPABASE_DB_URL at the Session Pooler host, not the direct
# db.<ref>.supabase.co host — most PaaS runners are IPv4-only and the direct host is IPv6-only.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

wealth:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN}
